services:
  - type: pserv
    name: treasurypilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_TOKEN
        sync: false
      - key: APP_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: treasurypilot-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: ""
      - key: AIRWALLEX_BASE_URL
        value: https://api.sandbox.airwallex.com

  - type: web
    name: treasurypilot-ui
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: "off"
    healthCheckPath: /api/health/ready
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: treasurypilot-api
          type: pserv
          property: hostport

databases:
  - name: treasurypilot-db
    databaseName: treasurypilot
    user: treasurypilot
